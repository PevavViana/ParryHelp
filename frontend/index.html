<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taxatio | Compare com confiança</title>
  <link rel="stylesheet" href="css/site.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="logo" href="index.html">
        <span class="logo-mark">✓</span>
        <span>Taxat<span class="logo-accent">io</span></span>
      </a>

      <form class="search-bar" data-search-form>
        <input name="q" type="search" placeholder="Buscar por produto ou categoria..." aria-label="Buscar">
        <button class="btn btn-primary" type="submit">Buscar</button>
      </form>

      <nav class="header-actions">
        <button class="btn btn-outline" data-open-auth data-auth-mode="login">Entrar</button>
        <span class="btn btn-header" data-auth-status style="display:none"></span>
        <button class="btn btn-outline" data-logout style="display:none">Sair</button>
        <a class="btn btn-header" href="avaliacoes.html">Avaliações</a>
        <button class="icon-btn" type="button" data-open-auth aria-label="Abrir acesso">☰</button>
      </nav>
    </div>
  </header>

  <main class="hero">
    <div class="hero-content">
      <p class="eyebrow">Curadoria independente de tecnologia</p>
      <h1>A Taxatio filtra o melhor <span>da tecnologia para você.</span></h1>
      <p>Pesquise produtos, compare experiências e descubra o que realmente vale a pena antes de comprar.</p>

      <div class="hero-actions">
        <a class="btn btn-primary" href="avaliacoes.html">Avalie aqui</a>
        <button class="btn btn-secondary" type="button" data-open-auth data-auth-mode="register">Criar uma conta</button>
      </div>
    </div>
  </main>

  <div class="modal-backdrop" data-auth-modal>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="auth-title">
      <button class="modal-close" type="button" data-close-modal aria-label="Fechar">×</button>
      <h2 id="auth-title">Acesse sua conta</h2>
      <p>Entre para acompanhar suas avaliações ou crie um cadastro.</p>

      <div class="modal-tabs">
        <button type="button" class="active" data-auth-tab="login">Entrar</button>
        <button type="button" data-auth-tab="register">Cadastrar</button>
      </div>

      <form class="modal-form" data-auth-form>
        <label data-register-field>
          Nome
          <input name="nome" type="text">
        </label>
        <label data-register-field>
          CPF
          <input name="cpf" type="text">
        </label>
        <label>
          E-mail
          <input name="email" type="email" required>
        </label>
        <label>
          Senha
          <input name="senha" type="password" required>
        </label>
        <button class="btn btn-primary" type="submit">Continuar</button>
      </form>
    </section>
  </div>

  <div class="toast" data-toast></div>

  <script src="js/common.js"></script>
</body>
</html>
