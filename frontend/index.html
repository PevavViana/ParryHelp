<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taxatio — Compare com confiança</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/home.css">
</head>
<body class="page-home">

<header class="site-header" id="siteHeader">
  <div class="header-inner">

    <a href="#" class="logo">
      <span class="logo-badge">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none">
          <path d="M12 2 L20 6 V12 C20 17 16.5 20.5 12 22 C7.5 20.5 4 17 4 12 V6 Z" fill="#3B5BFF"/>
          <path d="M9 12.2 L11 14.2 L15.5 9.5" stroke="#EDEFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </svg>
      </span>
      <span class="logo-text">Taxat<span class="logo-accent">io</span></span>
    </a>

    <div class="search-bar">
      <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="none">
        <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8"/>
        <path d="M21 21 L16.65 16.65" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <input type="text" placeholder="Buscar por produto, marca ou categoria...">
      <button class="btn-search" type="button">Buscar</button>
    </div>

    <nav class="header-actions">
      <button class="btn btn-outline">Avaliar</button>
      <button class="btn btn-ghost btn-dropdown">
        Categorias
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none"><path d="M6 9 L12 15 L18 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="icon-btn" aria-label="Notificações">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none">
          <path d="M12 3 C9.5 3 8 5 8 7.5 V10.5 C8 12 7.4 12.9 6.6 13.7 C6 14.3 6.3 15.3 7.2 15.3 H16.8 C17.7 15.3 18 14.3 17.4 13.7 C16.6 12.9 16 12 16 10.5 V7.5 C16 5 14.5 3 12 3 Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
          <path d="M10 18 C10 19 10.9 20 12 20 C13.1 20 14 19 14 18" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
      </button>
      <button class="icon-btn menu-btn" aria-label="Abrir menu">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none">
          <path d="M4 6 H20 M4 12 H20 M4 18 H14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </button>
    </nav>

  </div>
</header>

<div class="ambient-backdrop" aria-hidden="true">
  <div class="ambient-glow ambient-glow--a"></div>
  <div class="ambient-glow ambient-glow--b"></div>
  <div class="ambient-grain"></div>
  <div class="shape-field" id="shapeField"></div>
</div>

<main class="hero" id="hero">

  <div class="hero-content">
    <p class="eyebrow">
      <span class="eyebrow-dot"></span>
      Curadoria independente de tecnologia
    </p>

    <h1 class="hero-title">
      A Taxatio filtra o melhor
      <span class="hero-title-accent">da tecnologia para você.</span>
    </h1>

    <p class="hero-subtitle">
      Compre de forma segura, pesquisando os produtos mais bem avaliados
      por quem já usa no dia a dia.
    </p>

    <div class="hero-cta-row">
      <button class="btn btn-primary btn-lg" id="ctaBtn">
        <span>Avalie Aqui</span>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none"><path d="M5 12 H19 M13 6 L19 12 L13 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <a href="#" class="link-secondary">Ver categorias em alta →</a>
    </div>
  </div>
</main>

<script src="js/common.js"></script>
<script src="js/home.js"></script>
</body>
</html>
